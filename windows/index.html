<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Neo Trading Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#010805;color:#23ff84;font-family:Consolas,monospace;overflow:hidden}canvas#matrix{position:fixed;inset:0;opacity:.16;z-index:0}.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:250px 1fr;gap:12px;padding:14px}.panel{background:linear-gradient(135deg,rgba(1,18,11,.96),rgba(0,7,4,.94));border:1px solid #23ff84;border-radius:9px;box-shadow:0 0 18px #00ff7730}.gold{border-color:#f4c44a}.side{padding:18px;display:flex;flex-direction:column;gap:8px}.logo{color:#f4c44a;font-size:24px;font-weight:bold;letter-spacing:5px;margin-bottom:6px}.small{font-size:11px;color:#8fa99a}.nav,button{background:#020d08;color:#23ff84;border:1px solid #23ff84;border-radius:5px;padding:11px;font:inherit;cursor:pointer;text-align:left}.nav:hover,button:hover{box-shadow:0 0 14px #23ff8460}.nav.active{color:#f4c44a;border-color:#f4c44a}.main{display:grid;grid-template-rows:auto 1fr;gap:12px;min-width:0}.header{padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.content{overflow:auto;padding-right:5px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.card{padding:14px}.title{color:#f4c44a;font-weight:bold;letter-spacing:1px}.big{font-size:30px;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input{flex:1;min-width:180px;background:#010805;border:1px solid #23ff84;color:white;padding:11px;font:inherit}.coins{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:8px}.coin{padding:12px;display:grid;grid-template-columns:70px 1fr auto;align-items:center;cursor:pointer}.coin:hover{border-color:#f4c44a}.up{color:#23ff84}.down{color:#ff4b37}.radar{height:330px;position:relative;overflow:hidden;background:radial-gradient(circle,#032417 0,#010805 65%)}.radar:before{content:"";position:absolute;inset:8%;border:1px solid #23ff84;border-radius:50%;box-shadow:inset 0 0 0 55px #00ff7705,inset 0 0 0 110px #00ff7705}.sweep{position:absolute;width:45%;height:2px;background:#23ff84;left:50%;top:50%;transform-origin:left;animation:spin 3s linear infinite;box-shadow:0 0 18px #23ff84}@keyframes spin{to{transform:rotate(360deg)}}.detail{display:none}.detail.show{display:block}.addr{word-break:break-all;color:white;background:#00120a;padding:10px;margin:6px 0}.badge{padding:5px 8px;border:1px solid #f4c44a;color:#f4c44a;border-radius:4px}.status{color:#f4c44a}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.metric>div{padding:9px;border:1px solid #174b34}.foot{margin-top:auto;color:#789b87;font-size:10px}</style></head><body><canvas id="matrix"></canvas><div class="app"><aside class="panel gold side"><div class="logo">N E O</div><div class="small">TRADING TRACKER // WINDOWS</div><div class="small">CLASSIFIED MARKET INTELLIGENCE</div><button class="nav active" onclick="showDash()">⌂ DASHBOARD</button><button class="nav" onclick="scan()">◎ SCAN NOW</button><button class="nav" onclick="loadMarkets()">▥ LIVE MARKETS</button><button class="nav" onclick="renderWatch()">★ WATCHLIST</button><button class="nav" onclick="showAlerts()">♢ ALERTS</button><button class="nav" onclick="window.neo.open('https://t.me/SanjiTradingBot')">⚡ SANJI</button><div class="foot">SYSTEM // ONLINE<br>UPLINK // BINANCE<br>SOL MINT // JUPITER → COINGECKO</div></aside><main class="main"><header class="panel gold header"><div><span class="title">NEO TRADING TRACKER</span><div class="small">OMEGA DESKTOP COMMAND CENTRE</div></div><div class="status" id="clock"></div></header><section class="content" id="content"></section></main></div>
<script>
const watch=new Set(JSON.parse(localStorage.watch||'["BTC","ETH","XRP","SOL","DOGE","LINK","AVAX"]'));const $=s=>document.querySelector(s),fmt=n=>n>=100?n.toFixed(2):n>=1?n.toFixed(4):n.toFixed(6);function save(){localStorage.watch=JSON.stringify([...watch])}async function ticker(s){return fetch('https://api.binance.com/api/v3/ticker/24hr?symbol='+s+'USDT').then(r=>r.json())}
function shell(title,inner){$('#content').innerHTML='<div class="panel card"><div class="title">'+title+'</div>'+inner+'</div>'}function showDash(){shell('TACTICAL DASHBOARD','<div class="toolbar"><input id="sym" placeholder="TARGET SYMBOL // e.g. ADA"><button onclick="add()">＋ ADD TO WATCHLIST</button><button onclick="scan()">◎ SCAN NOW</button></div><div class="grid"><div><div class="title">TARGET INTELLIGENCE // WATCHLIST</div><div id="coins" class="coins"></div></div><div class="panel radar"><div class="sweep"></div><div style="padding:14px" class="title">TACTICAL MARKET RADAR // LIVE SWEEP</div></div></div>');renderCoins()}
async function renderCoins(){let b=$('#coins');if(!b)return;b.innerHTML='';for(const s of watch){try{let j=await ticker(s),p=+j.lastPrice,ch=+j.priceChangePercent;b.insertAdjacentHTML('beforeend','<div class="panel coin" onclick="detail(\''+s+'\')"><b>'+s+'</b><span>$'+fmt(p)+'</span><span class="'+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+ch.toFixed(2)+'%</span></div>')}catch(e){}}}
async function add(){let s=$('#sym').value.trim().toUpperCase().replace('USDT','');try{let j=await ticker(s);if(j.lastPrice){watch.add(s);save();renderCoins()}}catch(e){}}
async function scan(){shell('MARKET SCANNER // LIVE 24H','<div id="scan" class="coins"></div>');for(const s of watch){try{let j=await ticker(s),p=+j.lastPrice,lo=+j.lowPrice,hi=+j.highPrice,ch=+j.priceChangePercent,r=Math.max(hi-lo,p*.001),pos=(p-lo)/r,signal=ch>1&&pos<.82?'ENTER':ch<-3||pos>.94?'NO ACTION':'WAIT',bid=signal==='ENTER'?p-r*.08:signal==='WAIT'?p-r*.16:lo+r*.25;$('#scan').insertAdjacentHTML('beforeend','<div class="panel card" onclick="detail(\''+s+'\')"><b>'+s+'</b> <span class="badge">'+signal+'</span><div>$'+fmt(p)+' // '+ch.toFixed(2)+'%</div><div class="small">IDEAL BID $'+fmt(bid)+'</div></div>')}catch(e){}}}
async function loadMarkets(){shell('LIVE MARKETS','<div class="small">Desktop market board uses your tracked Binance USDT assets. Add any Binance USDT symbol from Dashboard.</div><div id="coins" class="coins"></div>');renderCoins()}function renderWatch(){loadMarkets()}function showAlerts(){shell('ALERT CENTRE','<p>Price alerts are stored locally on this Windows PC. Open a coin to set a target.</p><div id="alerts"></div>');let a=JSON.parse(localStorage.alerts||'{}');$('#alerts').innerHTML=Object.entries(a).map(([s,v])=>'<div class="panel card">'+s+' / USDT → $'+v+'</div>').join('')||'<div class="small">NO ARMED ALERTS</div>'}
async function solMint(sym){for(const u of ['https://lite-api.jup.ag/tokens/v2/search?query='+encodeURIComponent(sym),'https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(sym)]){try{let r=await fetch(u);if(!r.ok)continue;let j=await r.json();if(Array.isArray(j)){let x=j.find(x=>(x.symbol||'').toUpperCase()===sym);if(x&&(x.id||x.address||x.mint))return x.id||x.address||x.mint}else if(j.coins){let x=j.coins.find(x=>(x.symbol||'').toUpperCase()===sym);if(x){let d=await fetch('https://api.coingecko.com/api/v3/coins/'+x.id).then(r=>r.json());if(d.platforms&&d.platforms.solana)return d.platforms.solana}}}catch(e){}}return null}
async function detail(s){let j=await ticker(s),p=+j.lastPrice,ch=+j.priceChangePercent,lo=+j.lowPrice,hi=+j.highPrice,r=Math.max(hi-lo,p*.001),pos=(p-lo)/r,signal=ch>1&&pos<.82?'ENTER':ch<-3||pos>.94?'NO ACTION':'WAIT',bid=signal==='ENTER'?p-r*.08:signal==='WAIT'?p-r*.16:lo+r*.25;shell(s+' / USDT','<div class="big">$'+fmt(p)+'</div><div class="'+(ch>=0?'up':'down')+'">'+ch.toFixed(2)+'% (24H)</div><div class="metric"><div>ACTION<br><b>'+signal+'</b></div><div>IDEAL BID<br>$'+fmt(bid)+'</div><div>TARGET 1<br>$'+fmt(p*1.015)+'</div><div>STOP<br>$'+fmt(p*.975)+'</div></div><div id="minute" class="panel card status">1 MINUTE MOVE // BASELINE $'+fmt(p)+'</div><h3 class="title">SOLANA TOKEN ADDRESS</h3><div id="mint" class="small">RESOLVING JUPITER / COINGECKO...</div><div class="toolbar"><button onclick="openChart(\''+s+'\')">LIVE CANDLES</button><button onclick="setAlert(\''+s+'\','+p+')">♢ SET ALERT</button><button onclick="window.neo.open(\'https://t.me/SanjiTradingBot\')">⚡ SANJI</button></div><div id="back" class="small">BACKTEST // CALCULATING 90D HISTORY...</div>');let m=await solMint(s);$('#mint').innerHTML=m?'<div class="addr">'+m+'</div><button onclick="neo.copy(\''+m+'\')">COPY SOL ADDRESS</button> <button onclick="neo.open(\'https://jup.ag/swap/SOL-'+m+'\')">BUY WITH SOL // JUPITER</button>':'NATIVE ASSET OR NO VERIFIED SOLANA MINT FOUND';minute(s,p);backtest(s)}
function openChart(s){window.neo.open('https://www.tradingview.com/chart/?symbol=BINANCE:'+s+'USDT')}function setAlert(s,p){let v=prompt(s+' target USDT price',p);if(!v||isNaN(+v))return;let a=JSON.parse(localStorage.alerts||'{}');a[s]=+v;localStorage.alerts=JSON.stringify(a)}
function minute(s,base){let prev=base;setInterval(async()=>{try{let j=await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+s+'USDT').then(r=>r.json()),p=+j.price,m=(p-prev)/prev*100,el=$('#minute');if(el)el.textContent=(m>=0?'▲ ':'▼ ')+'1 MINUTE // '+(m>=0?'+':'')+m.toFixed(3)+'% // $'+fmt(p);prev=p}catch(e){}},60000)}
async function backtest(s){try{let end=Date.now(),start=end-90*86400000,a=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'USDT&interval=4h&startTime='+start+'&endTime='+end+'&limit=1000').then(r=>r.json()),k=a.map(x=>({h:+x[2],l:+x[3],c:+x[4]})),w=0,l=0,u=0;for(let i=6;i<k.length-6;i++){let prev=k[i-6].c,p=k[i].c,ch=(p-prev)/prev*100,win=k.slice(i-5,i+1),lo=Math.min(...win.map(x=>x.l)),hi=Math.max(...win.map(x=>x.h)),range=Math.max(hi-lo,p*.001),pos=(p-lo)/range;if(!(ch>1&&pos<.82))continue;let en=p*1.001,t=en*1.015,st=en*.975,o=0;for(let q=i+1;q<=Math.min(i+6,k.length-1);q++){let hs=k[q].l<=st,ht=k[q].h>=t*1.001;if(hs&&ht){o=-1;break}if(ht){o=1;break}if(hs){o=-1;break}}o===1?w++:o===-1?l++:u++}let el=$('#back');if(el)el.textContent='BACKTEST // '+w+'/'+(w+l)+' WINS · '+(w+l?w*100/(w+l):0).toFixed(1)+'% · SAMPLE '+(w+l)+' · PERIOD 90D · 4H CANDLES'}catch(e){}}
setInterval(()=>$('#clock').textContent=new Date().toLocaleString(),1000);showDash();
let cv=$('#matrix'),cx=cv.getContext('2d');function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);let y=[];function rain(){cx.fillStyle='#01080518';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#00a854';cx.font='14px monospace';let n=Math.ceil(cv.width/20);for(let i=0;i<n;i++){y[i]=y[i]||Math.random()*cv.height;cx.fillText('01{}<>#@+'[Math.floor(Math.random()*8)],i*20,y[i]);y[i]=y[i]>cv.height?0:y[i]+16}requestAnimationFrame(rain)}rain();
</script></body></html>
