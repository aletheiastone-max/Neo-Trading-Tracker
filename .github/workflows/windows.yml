name: Build Windows EXE
on:
  push:
    branches: [ main ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Neo-Trading-Tracker-Windows
          path: |
            windows/dist/*.exe
